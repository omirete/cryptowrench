[project]
name = "cryptowrench"
version = "0.1.7"
description = "A set of tools for nerding around with crypto."
authors = [{ name = "Federico Giancarelli", email = "hello@federicogiancarelli.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mnemonic>=0.20,<0.21",
    "base58>=2.1.1,<3",
    "pycryptodome>=3.15.0,<4",
    "cryptography>=37.0.4,<38",
    "bech32>=1.2.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "unit: isolated helper validation and checksum checks",
    "integration: wallet construction, imports, and derivation checks",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
